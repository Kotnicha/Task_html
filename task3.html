<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ตารางแผนการเดินทางท่องเที่ยว</title>
</head>
<body>

    <table border="1">

        <thead>
            <tr>
                <th>วันที่</th>
                <th>สถานที่</th>
                <th>ค่าใช้จ่ายโดยประมาณ</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>วันที่ 1</td>
                <td>หมู่เกาะสุรินทร์</td>
                <td>3,500 บาท</td>
            </tr>

            <tr>
                <td>วันที่ 2</td>
                <td>เกาะสิมิลัน</td>
                <td>2,000 บาท</td>
            </tr>
        </tbody>

        <tbody>
            <tr>
                <td>วันที่ 3</td>
                <td>เกาะเตียบ</td>
                <td>1,500 บาท</td>
            </tr>

        <tfoot>
            <tr>
                <td colspan="2">รวมค่าใช้จ่ายทั้งหมด</td>
                <td>7,000บาท</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
